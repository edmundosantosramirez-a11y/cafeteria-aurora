<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contacta a Café Aurora.">
  <title>Café Aurora | Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-title="t_cont">
  <a class="skip" href="#contenido" data-i18n="skip">Saltar al contenido</a>
  <header>
    <p class="logo">Café Aurora</p>
    <nav aria-label="Principal">
      <ul>
        <li><a href="index.html" data-i18n="nav_home">Inicio</a></li>
        <li><a href="servicios.html" data-i18n="nav_serv">Servicios</a></li>
        <li><a href="contacto.html" aria-current="page" data-i18n="nav_cont">Contacto</a></li>
      </ul>
    </nav>
    <button id="btn-lang" type="button">EN</button>
  </header>
  <main id="contenido">
    <h1 data-i18n="h1_cont">Contáctanos</h1>
    <div class="contacto">
      <section>
        <form id="form">
          <label for="nombre" data-i18n="label_name">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" data-i18n-ph="ph_name">
          <label for="correo" data-i18n="label_email">Correo electrónico</label>
          <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
          <label for="mensaje" data-i18n="label_msg">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje" data-i18n-ph="ph_msg"></textarea>
          <button class="btn" type="submit" data-i18n="send">Enviar</button>
          <p id="msg" role="status"></p>
        </form>
      </section>
      <aside>
        <h2 data-i18n="addr_h">Visítanos</h2>
        <p data-i18n="addr_p">Av. Universidad 100, Monterrey, N. L.</p>
        <p data-i18n="hours_p">Lunes a sábado de 7:00 a 21:00. Domingo de 8:00 a 15:00.</p>
      </aside>
    </div>
  </main>
  <footer>
    <p data-i18n="foot">© 2026 Café Aurora. Sitio de práctica universitaria.</p>
  </footer>
  <script src="js/idioma.js"></script>
</body>
</html>
